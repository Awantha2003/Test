name: app_control
description: Rakawala app controls for Android - app usage, blocking and time schedules.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: lk.rakawala.app_control
        pluginClass: AppControlPlugin
